[project]
name = "ovlm"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "sam3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ovlm = "ovlm.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
